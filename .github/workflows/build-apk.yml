name: Build HTML OS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          icon = Path("app/src/main/res/drawable-nodpi/html_os_icon.png")
          data = icon.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Launcher icon is not a PNG file")
          if data[12:16] != b"IHDR":
              raise SystemExit("Launcher icon has no PNG IHDR header")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (96, 96):
              raise SystemExit(f"Unexpected launcher icon size: {width}x{height}")
          expected_crc = struct.unpack(">I", data[29:33])[0]
          actual_crc = zlib.crc32(data[12:29]) & 0xffffffff
          if expected_crc != actual_crc:
              raise SystemExit("Launcher icon PNG header checksum is invalid")
          print(f"Launcher icon OK: {width}x{height}, {len(data)} bytes")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-OS-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
