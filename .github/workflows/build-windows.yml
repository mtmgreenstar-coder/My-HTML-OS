name: Build HTML OS for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source and prepare Windows icon
        run: |
          python -m pip install --disable-pip-version-check pillow
          python windows/prepare_icon.py

      - name: Restore
        run: dotnet restore windows/HTML-OS-Windows.csproj

      - name: Publish single-file Windows x64 app
        run: dotnet publish windows/HTML-OS-Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output publish/HTML-OS-Windows

      - name: Verify single executable output
        shell: pwsh
        run: |
          $exe = "publish/HTML-OS-Windows/HTML-OS.exe"
          if (!(Test-Path $exe)) { throw "HTML-OS.exe was not generated" }
          $files = Get-ChildItem "publish/HTML-OS-Windows" -File
          if ($files.Count -ne 1 -or $files[0].Name -ne "HTML-OS.exe") {
            $files | Format-Table Name, Length
            throw "Publish output is not a single-file app"
          }
          if ((Get-Item $exe).Length -lt 10000000) { throw "Executable is unexpectedly small" }
          Write-Host "Single-file EXE verified: $((Get-Item $exe).Length) bytes"

      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: HTML-OS-Windows-Single-EXE
          path: publish/HTML-OS-Windows/HTML-OS.exe
          if-no-files-found: error
          retention-days: 14
