name: Build HTML OS for Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source and prepare Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          html = Path("app/src/main/assets/index.html")
          png = Path("app/src/main/res/drawable-nodpi/html_os_icon.png")
          if not html.is_file() or html.stat().st_size < 1000:
              raise SystemExit("Main HTML OS source is missing or unexpectedly small")
          if not png.is_file():
              raise SystemExit("HTML OS logo PNG is missing")
          with Image.open(png) as im:
              im.verify()
          with Image.open(png) as im:
              im.convert("RGBA").save("windows/assets/html_os_icon.ico", format="ICO",
                                      sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(96,96)])
          print(f"Validated HTML ({html.stat().st_size} bytes) and logo ({png.stat().st_size} bytes)")
          PY

      - name: Restore
        run: dotnet restore windows/HTML-OS-Windows.csproj

      - name: Publish Windows x64
        run: dotnet publish windows/HTML-OS-Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output publish/HTML-OS-Windows

      - name: Add instructions
        shell: pwsh
        run: Copy-Item windows/README.txt publish/HTML-OS-Windows/README.txt

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/HTML-OS-Windows/* -DestinationPath HTML-OS-Windows-x64.zip

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: HTML-OS-Windows-x64
          path: HTML-OS-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
